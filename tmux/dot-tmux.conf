# Window names are set by Claude Code hooks — icon only, no word:
#   "↻" = working (default style)
#   "⏸" = idle, awaiting next prompt (blue)
#   "⚠" = blocked, needs your action (yellow)
#
# #{@dir} is a custom per-window field set by the voice command "rename current
# window" (daemon → scripts/tmux-name-window.sh in the bluey_whisper repo). It
# holds the working folder name and is independent of the hook-owned name above,
# so they never conflict. Shown as "<dir> <icon>", e.g. "bluey_whisper ⚠".

# Stop tmux and child processes from renaming windows out from under our hooks.
set -g automatic-rename off
set -g allow-rename off

# Default is 15s — that's the lag on window-name/colour updates after a hook fires.
set -g status-interval 1

# Drop the index from view (Ctrl-B + number still navigates). Show the working
# folder (@dir) when set, then the hook-owned status icon.
set -g window-status-format         ' #{?#{@dir},#{@dir} ,}#W '
set -g window-status-current-format ' #{?#{@dir},#{@dir} ,}#W '
set -g window-status-current-style  'fg=black,bg=green,bold'

# Conditional styling on inactive windows based on name prefix.
# ⚠* → bold yellow (blocked). ⏸* → yellow (idle). Else default.
set -g window-status-style '#{?#{m:⚠*,#W},fg=black bg=yellow bold,#{?#{m:⏸*,#W},fg=white bg=blue,default}}'
